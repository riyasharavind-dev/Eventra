name: vendor
description: "Eventra Vendor App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # Supabase backend
  supabase_flutter: ^2.17.2

  # Image selection and cropping
  url_launcher: ^6.3.2

  image_picker: ^1.2.1
  image_cropper: ^12.2.1

  # Firebase and push notifications
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Location and permissions
  geolocator: ^14.0.3
  permission_handler: ^13.0.2
  flutter_map: 8.3.2
  latlong2: 0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App launcher icon generator
  flutter_launcher_icons: ^0.14.4

# Launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/eventra_logo.png"
  adaptive_icon_background: "#59000D"
  adaptive_icon_foreground: "assets/images/eventra_logo.png"

flutter:
  uses-material-design: true

  # Eventra assets
  assets:
    - assets/images/eventra_logo.png
    - assets/splash/