name: eventor_customer
description: "Eventor Customer application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.17.2

  # Firebase
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Image / Permissions
  image_picker: ^1.2.3
  permission_handler: ^13.0.2

  # External URLs
  url_launcher: ^6.3.2

  # OpenStreetMap (same provider as the vendor app)
  flutter_map: 8.3.2
  latlong2: 0.9.1

  geolocator: ^14.0.3

  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
