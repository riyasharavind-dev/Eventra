<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Eventor Admin application.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Eventor Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Eventor Admin</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #fff; }
    #eventor-splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      background: #fff;
    }
    .eventor-wordmark {
      display: flex;
      align-items: center;
    }
    .eventor-monogram { width: clamp(42px, 15vw, 60px); }
    .eventor-letters {
      width: min(56vw, 294px);
      min-width: 0;
      overflow: hidden;
      margin-left: 6px;
      animation: eventor-reveal 650ms 120ms both cubic-bezier(.65, 0, .35, 1);
    }
    .eventor-letters img { display: block; width: min(56vw, 294px); }
    @keyframes eventor-reveal {
      from { width: 0; margin-left: 0; }
      to { width: min(56vw, 294px); margin-left: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .eventor-letters { animation: none; }
    }
    #eventor-splash-error {
      position: absolute;
      top: calc(50% + 64px);
      max-width: 85vw;
      text-align: center;
      font: 1rem system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="eventor-splash" role="status" aria-label="Loading Eventor Admin">
    <div class="eventor-wordmark" aria-hidden="true">
      <img class="eventor-monogram" src="icons/eventor_monogram.svg" alt="">
      <div class="eventor-letters">
        <img src="icons/eventor_ventor.svg" alt="">
      </div>
    </div>
    <p id="eventor-splash-error" hidden>
      Eventor Admin is taking longer than expected. <a href="./">Reload</a>
    </p>
  </div>
  <script>
    const splash = document.getElementById('eventor-splash');
    const splashError = document.getElementById('eventor-splash-error');
    splashError.querySelector('a').addEventListener('click', event => {
      event.preventDefault();
      location.reload();
    });
    const startupTimeout = setTimeout(() => { splashError.hidden = false; }, 20000);
    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(startupTimeout);
      const reveal = splash.querySelector('.eventor-letters').getAnimations();
      Promise.allSettled(reveal.map(animation => animation.finished))
        .then(() => splash.remove());
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
